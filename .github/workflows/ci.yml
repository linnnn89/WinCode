name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Windows regression (Node ${{ matrix.node }})
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install locked Node dependencies
        run: npm ci
      - name: Build and verify delivery
        run: npm run check
      - name: Verify tool errors and recovery contracts
        if: matrix.node == '22'
        run: npm run test:error-contracts
      - name: Verify real Roslyn semantics and process cleanup
        if: matrix.node == '22'
        run: |
          npm run test:roslyn-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:roslyn-gateway
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve bounded check report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-node-${{ matrix.node }}
          path: |
            test-tmp/check/**/report.json
            test-tmp/error-contracts/**/report.json
            test-tmp/roslyn-host/**/report.json
            test-tmp/roslyn-gateway/**/report.json
          if-no-files-found: warn
          retention-days: 7
